<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobraz İletişim | Yapım Aşamasında</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#FFFFFF;
    --ink:#111111;
    --yellow:#FCDA04;
    --muted:#6B6B6B;
    --line:#EDEDED;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  .corner-mark{
    position:absolute;
    width:220px; height:220px;
    background:var(--yellow);
    clip-path:polygon(0 0, 100% 0, 0 100%);
  }
  .corner-mark.tl{ top:0; left:0; }
  .corner-mark.br{ bottom:0; right:0; transform:rotate(180deg); }

  .card{
    position:relative;
    z-index:2;
    width:min(600px, 88vw);
    text-align:center;
    padding:40px;
  }

  .logo{
    width:280px;
    max-width:80%;
    margin:0 auto 44px;
    display:block;
  }

  .tag{
    display:inline-block;
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink);
    background:var(--yellow);
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:26px;
  }

  h1{
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size:clamp(30px, 5vw, 44px);
    letter-spacing:-0.01em;
    line-height:1.08;
    margin-bottom:18px;
  }
  h1 .hi{
    position:relative;
    white-space:nowrap;
  }
  h1 .hi::after{
    content:"";
    position:absolute;
    left:-2%; right:-2%; bottom:6px;
    height:14px;
    background:var(--yellow);
    z-index:-1;
  }

  p.sub{
    color:var(--muted);
    font-size:15.5px;
    line-height:1.65;
    max-width:420px;
    margin:0 auto 34px;
  }

  .contact{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    color:var(--ink);
    border:1.5px solid var(--ink);
    padding:12px 24px;
    border-radius:999px;
  }
  .contact a{
    color:var(--ink);
    text-decoration:none;
    font-weight:600;
    border-bottom:2px solid var(--yellow);
  }
  .contact a:hover{ opacity:0.7; }

  .footer-note{
    margin-top:38px;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#B5B5B5;
  }

  @media (max-width:520px){
    .corner-mark{ width:120px; height:120px; }
  }
</style>
</head>
